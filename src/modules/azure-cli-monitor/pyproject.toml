[project]
name = "azure-cli-monitor"
version = "2.73.0"
description = "Microsoft Azure Command-Line Tools Monitor Module"
authors = [
    { name = "Microsoft Corporation", email = "azpycli@microsoft.com" }
]
license = "MIT"
requires-python = ">=3.9.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "antlr4-python3-runtime~=4.13.1",
    "azure-cli-core==2.73.0",
    'azure-mgmt-monitor~=7.0.0b1',
]

[project.urls]
Homepage = "https://github.com/Azure/azure-cli"

[tool.setuptools]
zip-safe = false
packages = [
    "azure.cli.command_modules.monitor"
]

[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"
